services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      PUBLIC_SPOTIFY_CLIENT_ID: ${PUBLIC_SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      THUMBNAIL_CACHE_DIR: ${THUMBNAIL_CACHE_DIR:-/data/thumbnails}
    volumes:
      - sqlite_data:/data
    depends_on:
      - indexer

  indexer:
    image: ghcr.io/khordapp/khord-indexer:latest
    restart: unless-stopped
    environment:
      INDEXER_DB_PATH: /data/khord.db
      FIREHOSE_RELAY: ${FIREHOSE_RELAY:-wss://bsky.network}
    volumes:
      - sqlite_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  sqlite_data:   # shared between app and indexer
  caddy_data:    # TLS certificates
  caddy_config:  # Caddy internal config
